# Render "Blueprint" — lets Render auto-configure this app (web service +
# persistent disk + secret) in one step when you connect this repo.
# See: https://render.com/docs/infrastructure-as-code
services:
  - type: web
    name: lpc-parent-hub
    runtime: node
    plan: starter          # smallest paid tier; required for a persistent disk
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true       # Render generates a random secret for you
      - key: DB_PATH
        value: /var/data/lpc_hub.sqlite
      - key: NODE_ENV
        value: production
    disk:
      name: lpc-data
      mountPath: /var/data
      sizeGB: 1
